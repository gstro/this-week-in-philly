name: Presentation
on:
  push:
    # branches: [main] closes the gap that caused the 2026-08-02 incident: a
    # scratch-branch push to _selections.json fired this workflow for real,
    # including a real (unintended) calendar_create.py write, since `on:
    # push` with no branch filter matches a push to ANY branch.
    branches: [main]
    paths:
      # Selection's own push, not a merge commit's -- the merge that
      # produces _selections.json now happens inside this workflow (the
      # "Merge selections" step below), not before it. Selection pushes
      # _selection_annotations.json with ambient user auth (not the default
      # GITHUB_TOKEN), so this trigger fires for that push; a workflow that
      # instead merged-and-pushed _selections.json itself would push with
      # GITHUB_TOKEN, which doesn't retrigger `on: push` -- see
      # merge_selections.py's docstring.
      - 'data/**/_selection_annotations.json'
  # How Selection's output normally arrives now. main only accepts PRs (the
  # 2026-09-26 ruleset), so the Routine pushes to its own claude/* branch and
  # selection-merge.yml merges it with GITHUB_TOKEN -- and a GITHUB_TOKEN merge
  # never fires the `push` trigger above, so selection-merge.yml dispatches
  # this workflow explicitly with the week. The push trigger stays for a PR a
  # human merges in the UI; the two paths never both fire for one merge.
  # Also the manual "re-publish week X" button.
  workflow_dispatch:
    inputs:
      week_dir:
        description: 'Week directory to publish, e.g. data/2026-09-28'
        required: true
        type: string
      engine:
        description: 'Which implementation runs: python or ts (anything else fails the run). Blank = the PRESENTATION_ENGINE repo variable (python if unset).'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Rehearsal: run every step with --dry-run on the Spotify playlist and Calendar writes, but do not commit or open a PR. The report and data files are uploaded as a build artifact.'
        required: false
        type: boolean
        default: false
jobs:
  present:
    runs-on: ubuntu-latest
    env:
      # Tier D (docs/TS_PORT.md): "python" runs scripts/, "ts" runs the
      # TypeScript port from dist/. Scheduled/dispatched-by-Selection runs use
      # the repo variable, so cutting this stage over (or rolling it back) is a
      # settings change, not a PR. scripts/ci/pipeline.sh reads it.
      ENGINE: ${{ inputs.engine || vars.PRESENTATION_ENGINE || 'python' }}
    # Default GITHUB_TOKEN needs write access to push the report -- confirmed
    # missing the hard way: a real run (30721803844) got through the whole
    # pipeline (including a real, unintended calendar_create.py write -- see
    # git log) and only failed at the final `git push`, with "Permission to
    # ...git denied to github-actions[bot]" (403). collection.yml already
    # sets this for the same reason.
    # pull-requests: the report reaches main through a PR that
    # scripts/ci/merge_via_pr.sh opens and merges (2026-09-26 ruleset).
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Fail fast on a mistyped engine variable, before anything is installed
      # (Actions compares strings case-insensitively; pipeline.sh lowercases to
      # match). Without this, a typo would only surface at the first step that
      # calls pipeline.sh.
      - name: Check engine
        run: |
          case "${ENGINE,,}" in
            python|ts) echo "Engine: ${ENGINE,,}" ;;
            *) echo "::error::PRESENTATION_ENGINE / the engine input must be 'python' or 'ts', got '$ENGINE'"; exit 1 ;;
          esac
      # fetch-depth: 2 (not the default 1) -- the week-dir derivation below
      # needs HEAD^ to exist. presentation.yml ran with the default twice
      # (29652043283, 29702768189) and failed both times because HEAD~1 was
      # unreachable, WEEK_DIR silently became "", and dirname "" -> "." got
      # passed to every script as the week dir. collection-check.yml already
      # sets this for the same reason.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        if: env.ENGINE != 'ts'
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: 'scripts/requirements*.txt'
      - run: pip install -r scripts/requirements.txt
        if: env.ENGINE != 'ts'

      # The TypeScript engine: Node (the version in .nvmrc) and the build in
      # dist/. No browser is needed; Presentation never fetches a page.
      - uses: actions/setup-node@v4
        if: env.ENGINE == 'ts'
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Build (TypeScript engine)
        if: env.ENGINE == 'ts'
        run: |
          npm ci
          npm run build

      # Reads off _selection_annotations.json now (Selection's own push),
      # not _selections.json (which this workflow itself now produces, in
      # the Merge selections step below).
      - name: Determine week directory
        id: week
        env:
          INPUT_WEEK_DIR: ${{ inputs.week_dir }}
        run: |
          # Dispatched (selection-merge.yml or by hand): the week is given.
          # Validated rather than trusted -- it's interpolated into every
          # later step.
          if [ -n "$INPUT_WEEK_DIR" ]; then
            WEEK_DIR="${INPUT_WEEK_DIR%/}"
            if ! [[ "$WEEK_DIR" =~ ^data/[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::week_dir must look like data/YYYY-MM-DD, got '$WEEK_DIR'"
              exit 1
            fi
            if [ ! -f "$WEEK_DIR/_selection_annotations.json" ]; then
              echo "::error::$WEEK_DIR/_selection_annotations.json is not on main -- nothing to publish"
              exit 1
            fi
            echo "dir=$WEEK_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOUCHED=$(git diff --name-only HEAD^ HEAD -- 'data/**/_selection_annotations.json')
          if [ -z "$TOUCHED" ]; then
            echo "::error::Could not determine week directory from the push diff"
            exit 1
          fi
          # This previously took `| head -1`, which silently dropped every
          # other week a push touched. The problem was the silence, not the
          # picking: a PR that backfills a historical week while a current
          # week is live is routine (tranche 2's own PR had that shape), and
          # failing the job there would block the legitimate publish. So pick
          # the newest week -- dir names are YYYY-MM-DD, so lexicographic
          # order is chronological -- and say out loud what was skipped.
          # Publishing a past week is no longer dangerous anyway:
          # calendar_create.py's week_has_already_begun() guard makes it a
          # report-only re-render.
          WEEK_DIR=$(dirname "$(echo "$TOUCHED" | sort | tail -1)")
          COUNT=$(echo "$TOUCHED" | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 1 ]; then
            echo "::warning::Push touched $COUNT weeks' annotations; publishing only the newest ($WEEK_DIR)."
            echo "All weeks touched by this push:"
            echo "$TOUCHED"
          fi
          if [ "$WEEK_DIR" = "." ]; then
            echo "::error::Could not determine week directory from the push diff"
            exit 1
          fi
          echo "dir=$WEEK_DIR" >> "$GITHUB_OUTPUT"

      # Deterministic merge (_candidates.json + Selection's annotations ->
      # _selections.json) -- runs here rather than as its own workflow for
      # the same GITHUB_TOKEN-doesn't-retrigger reason explained in this
      # trigger's `paths` comment above. See merge_selections.py's docstring.
      - name: Merge selections
        run: scripts/ci/pipeline.sh merge-selections "${{ steps.week.outputs.dir }}"

      # Mechanical post-conditions on the merged _selections.json (venue cap,
      # time-format regression guard, blank-cost regression guard) --
      # check_yield.py's role for Collection, applied to Selection's output.
      # Runs after the merge, not after Selection's own push, because title/
      # venue/cost don't exist until merge_selections.py reconstructs them.
      - name: Check selection
        run: scripts/ci/pipeline.sh check-selection "${{ steps.week.outputs.dir }}"

      # timeout-minutes: a hung Spotify call can no longer hold the job open
      # for hours (the lookup is also cut off on its own after 10 minutes, on
      # both engines). dry_run adds --dry-run, which the two external writes
      # (the playlist and the Calendar) honour.
      - name: Run presentation pipeline
        timeout-minutes: 20
        env:
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          # spotify_playlist.py only -- user auth, which spotify_lookup.py's
          # app-only Client Credentials flow can't provide. Absent these, that
          # step prints why and exits 0; the report still publishes.
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
        run: scripts/ci/pipeline.sh present "${{ steps.week.outputs.dir }}" $DRY_RUN_FLAG

      # main requires a PR (2026-09-26 ruleset, no bypass actors): commit to a
      # bot branch and merge it through an immediately merged PR. On
      # 2026-09-27 a bare `git push` here was rejected *after* Spotify and
      # Calendar had already been written, and the rendered report was lost
      # with the runner. Committed as github-actions[bot] -- a real account;
      # the ruleset wants extra approval for unattributed commits.
      # Rehearsal (dry_run): nothing is committed and no PR is opened -- the
      # rendered report and the week's data files are kept as a build artifact
      # instead, so either engine can be inspected and diffed against main.
      - name: Upload rehearsal output
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          # Not the week dir: artifact names cannot contain '/'.
          name: presentation-${{ github.run_id }}-${{ env.ENGINE }}
          path: |
            docs/weeks
            docs/index.html
            ${{ steps.week.outputs.dir }}/_selections.json
            ${{ steps.week.outputs.dir }}/_spotify.json
            ${{ steps.week.outputs.dir }}/_playlist.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit and merge report
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/event-picks-log.csv is intentionally not written here --
          # csv_log.py/attendance_check.py are deferred (see runner.sh);
          # only add it if a future run reintroduces that stage.
          # _spotify.json and _playlist.json must both be staged, and were
          # not: this step's `git add` never named either, so both files
          # existed only on the runner's ephemeral disk and were discarded
          # when the job ended -- this comment's own claim to the contrary
          # (below) was never true. Confirmed on the real 2026-09-07 run:
          # runner.sh's spotify_lookup.py wrote _spotify.json and
          # html_render.py used it (the published report has working Spotify
          # links), but data/2026-09-07/_spotify.json never made it to main.
          #
          # _playlist.json matters even more: without it committed, the next
          # run for this week can't find the playlist by id and would risk
          # creating a duplicate.
          #
          # `git add` on a path that doesn't exist is an error, so both are
          # guarded. Both are optional now: a Spotify failure no longer stops
          # the run (2026-10-14), so a failed lookup leaves _spotify.json
          # unwritten (or stale from an earlier run of the same week), and
          # spotify_playlist exits 0 without writing a _playlist.json when
          # Spotify user auth fails. The report renders without either.
          git add docs/ "${{ steps.week.outputs.dir }}/_selections.json"
          SPOTIFY_JSON="${{ steps.week.outputs.dir }}/_spotify.json"
          PLAYLIST_JSON="${{ steps.week.outputs.dir }}/_playlist.json"
          if [ -f "$SPOTIFY_JSON" ]; then
            git add "$SPOTIFY_JSON"
          fi
          if [ -f "$PLAYLIST_JSON" ]; then
            git add "$PLAYLIST_JSON"
          fi
          # Name the *week*, not the run date. `$(date +%F)` produced
          # "Publish report for 2026-08-23" for a run that rendered
          # data/2026-08-17, which cost real time to untangle. The run date
          # never equals the week anyway -- on-schedule runs fire the Sunday
          # before. Matches collection.yml's "Collection: week of ...".
          WEEK=$(basename "${{ steps.week.outputs.dir }}")
          if git diff --staged --quiet; then
            echo "Report unchanged for week of $WEEK; nothing to publish."
            exit 0
          fi
          git commit -m "Publish report for week of $WEEK"
          scripts/ci/merge_via_pr.sh --push \
            --branch "bot/publish-$WEEK" \
            --title "Publish report for week of $WEEK" \
            --body "Automated Presentation run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
