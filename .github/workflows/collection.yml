name: Collection
# Replaces the Claude Code Routine that used to run Collection.
#
# The Routine worked, but two real bugs traced directly to having a model in
# the loop: it improvised a conversion script that silently dropped the `url`
# field on all 15 Google Calendar events (2026-08-01), and before that it
# fabricated 17 empty source files sharing one made-up timestamp rather than
# report running out of budget (2026-07-27). A workflow has no budget to
# exhaust and no judgment to exercise -- scripts/collect_week.py either
# completes or fails loudly, per source.
on:
  schedule:
    # GitHub Actions cron is UTC and cannot follow DST. 07:30 UTC is 3:30am EDT
    # (Mar-Nov) and 2:30am EST (Nov-Mar) -- both early Sunday morning, which is
    # what the pipeline wants: the target week is the Monday immediately
    # following.
    # (History: 06:00 UTC / 2am EDT, moved to 13:00 UTC / 9am EDT on
    # 2026-10-10, moved back to 3:30am EDT on 2026-10-14.)
    # NOTE a UTC hour of 0-4 would be the evening *before* in ET, collecting a
    # day early (`0 2 * * 0` is 10pm Saturday ET); 07:30 is safe in both seasons.
    - cron: '30 7 * * 0'
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Monday of the target week (YYYY-MM-DD). Blank = next upcoming Monday.'
        required: false
        type: string
      trigger_selection:
        description: 'Fire the Selection routine after the data lands on main. Uncheck for a re-collection that should not re-run Selection.'
        required: false
        type: boolean
        default: true
      engine:
        description: 'Which implementation runs: python or ts (anything else fails the run). Blank = the COLLECTION_ENGINE repo variable (python if unset).'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Rehearsal: collect and check, but do not commit, open a PR or fire Selection. The week is uploaded as a build artifact.'
        required: false
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # Tier D (docs/TS_PORT.md): "python" runs scripts/, "ts" runs the
      # TypeScript port from dist/. A scheduled run uses the repo variable, so
      # cutting this stage over (or rolling it back) is a settings change, not
      # a PR. scripts/ci/pipeline.sh is the only thing that reads it.
      ENGINE: ${{ inputs.engine || vars.COLLECTION_ENGINE || 'python' }}
    # Default GITHUB_TOKEN needs write access to push the collected week.
    # contents + pull-requests: main is only reachable through a PR (the
    # 2026-09-26 ruleset), which scripts/ci/merge_via_pr.sh opens and merges.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Fail fast on a mistyped engine variable, before anything is installed
      # (Actions compares strings case-insensitively; pipeline.sh lowercases to
      # match). Without this, a typo would only surface at the first step that
      # calls pipeline.sh.
      - name: Check engine
        run: |
          case "${ENGINE,,}" in
            python|ts) echo "Engine: ${ENGINE,,}" ;;
            *) echo "::error::COLLECTION_ENGINE / the engine input must be 'python' or 'ts', got '$ENGINE'"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: env.ENGINE != 'ts'
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: 'scripts/requirements*.txt'

      # requirements-collection.txt (playwright/requests/beautifulsoup4) has
      # until now only been installed by lint.yml for type-checking -- this is
      # the first workflow that installs it to actually *run* collection.
      # requirements.txt is needed for the Google Calendar sources.
      - name: Install dependencies
        if: env.ENGINE != 'ts'
        run: pip install -r scripts/requirements.txt -r scripts/requirements-collection.txt

      # Only philadelphia-film-society needs a browser (Fandango's showtimes
      # are JS-rendered and its real backend is WAF-blocked). Proven working on
      # ubuntu-latest by lint.yml's pytest job.
      - name: Install Chromium
        if: env.ENGINE != 'ts'
        run: playwright install --with-deps chromium

      # The TypeScript engine: Node (the version in .nvmrc), the build in
      # dist/, and Playwright for Node's own Chromium (a separate browser
      # build from the Python one above, used by fetchPageText for the same
      # one source).
      - uses: actions/setup-node@v4
        if: env.ENGINE == 'ts'
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Build and install Chromium (TypeScript engine)
        if: env.ENGINE == 'ts'
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      # Computed explicitly and once, BEFORE collection, rather than inferred
      # afterward from `ls -d data/*/ | sort | tail -1` -- that inference is
      # what let a stray directory hijack a real run (2026-08-02: an old,
      # never-decommissioned Collection Routine independently pushed a
      # mistargeted data/2026-08-04/ straight to main; it happened to sort
      # after this run's real data/2026-08-03/, so Check yield and Prepare
      # selection candidates silently ran against the wrong week's data).
      # Uses common.target_week_monday() -- the same function collect_week.py
      # itself calls -- rather than re-deriving the date math here, so the two
      # can't drift apart.
      - name: Determine target week
        id: week
        run: |
          if [ -n "${{ inputs.week_start }}" ]; then
            WEEK_START="${{ inputs.week_start }}"
          else
            WEEK_START=$(scripts/ci/pipeline.sh target-week)
          fi
          echo "week_start=$WEEK_START" >> "$GITHUB_OUTPUT"
          echo "dir=data/$WEEK_START" >> "$GITHUB_OUTPUT"

      - name: Collect
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: scripts/ci/pipeline.sh collect --week-start "${{ steps.week.outputs.week_start }}"

      # This MUST run here, not only in collection-check.yml. Commits pushed
      # with the default GITHUB_TOKEN do not retrigger `on: push` workflows,
      # so collection-check.yml would never fire for this job's own push --
      # silently losing the anti-fabrication guard entirely. collection-check
      # is kept for pushes from any other source (a human commit, a manual
      # re-collection); this step is what covers the scheduled run.
      #
      # dry_run (a rehearsal) reports a yield failure without stopping, so the
      # later steps still run and the week still comes back as an artifact: an
      # off-schedule rehearsal collects a week that is not posted yet and
      # always trips a floor. A real run is unaffected (`false`).
      - name: Check yield
        continue-on-error: ${{ inputs.dry_run == true }}
        run: scripts/ci/pipeline.sh check-yield "${{ steps.week.outputs.dir }}"

      # Deterministic pre-filter for Selection (flatten+tag sources, exact-dup
      # collapse, recurring-listing grouping -- see the script's docstring).
      # Runs here, not as its own on:push workflow or inside Selection's own
      # Routine session, for the same GITHUB_TOKEN-doesn't-retrigger reason
      # "Check yield" runs inline above: this way its output lands in the
      # same commit as the rest of the week's data. continue-on-error,
      # unlike the yield check -- a bug in this derived-artifact step
      # shouldn't withhold otherwise-good raw Collection data; Selection's
      # own prerequisite guard already handles a missing _candidates.json
      # safely (stop and notify).
      - name: Prepare selection candidates
        continue-on-error: true
        run: scripts/ci/pipeline.sh prepare-selection "${{ steps.week.outputs.dir }}" --split-by-day

      # main requires a PR (repository ruleset added 2026-09-26, no bypass
      # actors), so this lands the week via a bot branch + immediately merged
      # PR instead of a direct push. Committed as github-actions[bot], a real
      # GitHub identity: the ruleset asks for extra approval on commits that
      # aren't attributed to an account, which twip-bot@users.noreply never was.
      # Rehearsal (dry_run): nothing is committed, no PR is opened, Selection is
      # not fired -- the week's files are kept as a build artifact instead, so a
      # run on either engine can be inspected and diffed without touching main.
      - name: Upload rehearsal output
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: collection-${{ steps.week.outputs.week_start }}-${{ github.run_id }}-${{ env.ENGINE }}
          path: ${{ steps.week.outputs.dir }}
          retention-days: 7

      - name: Commit and merge collected week
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only this run's own week directory -- not `git add data/`, which
          # would blindly absorb and commit anything else that showed up
          # under data/ between checkout and here (see the Determine target
          # week step's comment for exactly this happening).
          git add "${{ steps.week.outputs.dir }}"
          if git diff --staged --quiet; then
            echo "Nothing new to commit for this week."
            exit 0
          fi
          WEEK=$(basename "${{ steps.week.outputs.dir }}")
          git commit -m "Collection: week of $WEEK"
          scripts/ci/merge_via_pr.sh --push \
            --branch "bot/collection-$WEEK" \
            --title "Collection: week of $WEEK" \
            --body "Automated Collection run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Fires Selection's API trigger the moment this run's data is actually
      # on main, instead of relying solely on Selection's own fixed cron (30
      # min after this workflow's schedule) to guess when Collection is done.
      # That guess failed for real on 2026-09-06: GitHub Actions delayed this
      # scheduled run by over four hours, so Selection's cron fired first,
      # found no _candidates.json yet, and correctly no-op'd via its own
      # prerequisite guard (.claude/skills/philly-events-selection/SKILL.md)
      # -- safe, but it left Selection needing a manual re-trigger afterward.
      # This is the ONLY thing that starts Selection: the live routine has
      # no cron of its own (checked 2026-09-27 -- its cron_expression is
      # empty, despite older docs describing a fallback). If this step fails,
      # Selection must be fired by hand (claude.ai/code/routines -> Run now).
      # It runs after the merge step above, and must: the Routine clones
      # main, so the week's data has to be merged before it fires. Its own
      # guard still makes a redundant fire harmless ("already selected this
      # week" -> stop, don't overwrite). continue-on-error -- a failed
      # trigger call shouldn't mark otherwise-good Collection data as failed.
      #
      # Needs SELECTION_ROUTINE_ID (repo variable) and SELECTION_ROUTINE_TOKEN
      # (repo secret), both from the Selection routine's API trigger (added at
      # claude.ai/code/routines -- Edit routine > Select a trigger > API).
      # Unset until that trigger exists, at which point this starts working
      # with no further code change. /fire ships under an experimental beta
      # header (per Claude Code's routines docs) -- request/response shape and
      # header version may change.
      - name: Trigger Selection routine
        if: ${{ !inputs.dry_run && (github.event_name != 'workflow_dispatch' || inputs.trigger_selection) }}
        continue-on-error: true
        run: |
          curl -sf -X POST "https://api.anthropic.com/v1/claude_code/routines/${{ vars.SELECTION_ROUTINE_ID }}/fire" \
            -H "Authorization: Bearer ${{ secrets.SELECTION_ROUTINE_TOKEN }}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{}'
